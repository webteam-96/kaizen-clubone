<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23272729'/%3E%3Crect x='8' y='6' width='16' height='20' rx='1' fill='none' stroke='%23fff' stroke-width='1.6'/%3E%3Cpath d='M8 16h16M16 9v14' stroke='%23fff' stroke-width='1.6'/%3E%3C/svg%3E">
<meta name="theme-color" content="#f5f5f7">
<meta name="description" content="Kaizen ClubOne member app prototype: entry QR, amenity booking, wallet and guest passes.">
<title>ClubOne Member App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0066cc;--focus:#0071e3;--blue-dark:#2997ff;
  --ink:#1d1d1f;--ink2:#333333;--ink3:#7a7a7a;--on-dark2:#cccccc;
  --page:#f5f5f7;--card:#ffffff;--pearl:#fafafc;--soft:#f0f0f0;--hair:#e0e0e0;--chip:#d2d2d7;
  --tile1:#272729;--tile2:#2a2a2c;--tile3:#252527;
  --ok:#087A55;--bad:#B42828;--wait:#9A5B00;
  --ok-t:rgba(8,122,85,.1);--bad-t:rgba(180,40,40,.1);--wait-t:rgba(154,91,0,.1);--mute-t:rgba(0,0,0,.05);
  --frost:rgba(245,245,247,.8);--line:rgba(0,0,0,.08);
  --product:3px 5px 30px rgba(0,0,0,.22);
  --eo:cubic-bezier(.2,.8,.2,1);
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;
  --text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
  --top:50px;--bot:22px;--tabh:70px;
  /* elevation by role: quiet surfaces sit on the page, objects lift off it, chrome floats above everything */
  --flat:0 0 0 1px rgba(0,0,0,.035),0 1px 2px rgba(0,0,0,.035);
  --lift:0 0 0 1px rgba(0,0,0,.03),0 2px 4px rgba(0,0,0,.03),0 14px 32px -10px rgba(0,0,0,.14);
  --float:0 0 0 .5px rgba(0,0,0,.08),0 12px 40px rgba(0,0,0,.16);
  --object:inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 0 1px rgba(255,255,255,.06),0 24px 48px -16px rgba(0,0,0,.5),0 8px 16px -8px rgba(0,0,0,.25);
  --graphite:#161618;--sec-t:rgba(0,102,204,.1);--track:rgba(118,118,128,.12);
  /* springs: JS samples real spring curves into these; the fallbacks are plain ease-outs */
  --sp-press:cubic-bezier(.2,.8,.2,1);--sp-press-d:.45s;
  --sp-pill:cubic-bezier(.2,.8,.2,1);--sp-pill-d:.45s;
  --sp-soft:cubic-bezier(.2,.8,.2,1);--sp-soft-d:.5s;
  --sp-bouncy:cubic-bezier(.34,1.56,.64,1);--sp-bouncy-d:.6s;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100vh;font-family:var(--text);font-size:17px;font-weight:400;line-height:1.44;letter-spacing:-.374px;color:var(--ink);background:var(--page);-webkit-font-smoothing:antialiased;font-feature-settings:"ss03"}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;text-align:inherit}
/* press: in fast, out on a spring, so every tap lands like a physical key */
button,.acard,.rcard,.tab{transition:transform var(--sp-press-d) var(--sp-press)}
:is(button,.acard,.rcard,.tab):active{transform:scale(.96);transition:transform .1s cubic-bezier(.3,0,.5,1)}
:is(.bcard,.acard,.rcard,.me,.slot,.opt):active{transform:scale(.98)}
a{color:inherit;text-decoration:none}
svg{display:block;flex:none}
ul{list-style:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.cur{font-size:.8em;margin-right:.04em}
.money{white-space:nowrap}

/* Desktop: the phone rests on a parchment page */
.stage{min-height:100vh;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:48px;padding:24px}
.devwrap{position:relative;flex:none;width:calc(414px * var(--s,1));height:calc(868px * var(--s,1))}
.device{position:absolute;left:0;top:0;width:414px;height:868px;padding:11px;border-radius:64px;background:#000;border:1px solid #3a3a3c;transform:scale(var(--s,1));transform-origin:0 0;box-shadow:inset 0 0 0 2px #1c1c1e,0 60px 90px -30px rgba(0,0,0,.45),0 30px 50px -30px rgba(0,0,0,.4)}
/* black behind the screens: it shows when a sheet pushes the screen back */
.app{position:relative;width:390px;height:844px;border-radius:52px;overflow:hidden;background:#000;isolation:isolate}
.statusbar{position:absolute;left:0;right:0;top:0;height:50px;padding:17px 30px 0 44px;display:flex;justify-content:space-between;align-items:flex-start;font:600 16px/1 var(--text);letter-spacing:-.2px;z-index:70;pointer-events:none;color:var(--sb,var(--ink))}
.statusbar .icons{display:flex;gap:6px;align-items:center;margin-top:1px}
.statusbar svg{width:18px;height:12px}
.island{position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;border-radius:9999px;background:#000;z-index:71;pointer-events:none}
.homeind{position:absolute;bottom:8px;left:50%;width:136px;height:5px;margin-left:-68px;border-radius:9999px;background:var(--sb,var(--ink));z-index:72;pointer-events:none}
.app[data-tone=dark],.app.sheet-on{--sb:#fff}
@media (max-width:599px){
  :root{--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
  .stage{display:block;padding:0;min-height:0}
  .devwrap{width:auto;height:auto}
  .device{position:relative;width:100%;height:100vh;height:100dvh;padding:0;border:0;border-radius:0;background:none;transform:none}
  .app{width:100%;height:100%;border-radius:0}
  .statusbar,.island,.homeind,.demo{display:none}
}

/* Screens and frosted bars */
.screens{position:absolute;inset:0;overflow:hidden;background:var(--page);transition:transform var(--sp-soft-d) var(--sp-soft),border-radius var(--sp-soft-d) var(--sp-soft)}
/* a sheet pushes the screen back, the way a phone stacks cards */
.app.sheet-on .screens{transform:translateY(calc(var(--top) * .28)) scale(.92);border-radius:22px}
.screen{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;background:var(--page);padding:calc(var(--top) + 8px) 20px calc(var(--bot) + 32px);scrollbar-width:none;overscroll-behavior:contain}
.screen::-webkit-scrollbar{display:none}
.screen.has-tabs{padding-bottom:calc(var(--tabh) + var(--bot) + 32px)}
.tf{position:sticky;top:calc(-9px - var(--top));z-index:20;box-sizing:content-box;height:var(--top);padding-top:1px;margin:calc(-9px - var(--top)) -20px 8px;background:var(--frost);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
/* the bar is clear at rest and frosts, with its hairline, once content slides under it */
.bar{position:sticky;top:calc(-8px - var(--top));z-index:20;display:flex;align-items:center;gap:4px;min-height:calc(var(--top) + 52px);margin:calc(-8px - var(--top)) -20px 16px;padding:var(--top) 8px 0;background:rgba(245,245,247,0);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid transparent;transition:background-color .3s,border-color .3s}
.bar.on{background:var(--frost);border-bottom-color:var(--line)}
.bar h1{flex:1;font:600 17px/1.24 var(--text);letter-spacing:-.374px;text-align:center}
.bar .sp{width:44px;flex:none}
.ib{position:relative;width:44px;height:44px;display:grid;place-items:center;border-radius:9999px;color:var(--blue);flex:none}
.ib svg{width:22px;height:22px}
.ib.frost{background:rgba(255,255,255,.75);color:var(--ink);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 0 0 .5px rgba(0,0,0,.06),0 6px 16px rgba(0,0,0,.14)}
.tf.clear{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
.tf.clear.on{background:var(--frost);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.title{font:700 34px/1.12 var(--display);letter-spacing:-.022em;margin:8px 0 12px}
.title span{display:block;font:500 17px/1.44 var(--text);letter-spacing:-.374px;color:var(--ink2);margin-bottom:2px}
.lede{color:#6e6e73;margin-bottom:24px;max-width:36ch}
/* tab screens (Book, My bookings, Wallet, More): the heading and its intro line sit centred */
.screen.has-tabs > h1.title{text-align:center}
.screen.has-tabs > h1.title + .lede{margin-left:auto;margin-right:auto;text-align:center}
h2.sec{display:flex;align-items:center;justify-content:space-between;gap:12px;font:650 22px/1.2 var(--display);letter-spacing:-.018em;margin:36px 0 14px}
h2.sec button{font:400 17px/1.24 var(--text);letter-spacing:-.374px;color:var(--blue);min-height:44px;padding:0 4px}
h2.sec .cap{font-weight:400}
.link{display:inline-block;padding:8px 2px;margin:-8px 0;color:var(--blue)}
.fine{font-size:14px;line-height:1.43;letter-spacing:-.224px;color:var(--ink2);text-align:center;margin-top:12px}
.legal,.ver{font-size:12px;line-height:1.33;letter-spacing:-.12px;color:var(--ink3);text-align:center;margin-top:12px}
.ver{margin-top:24px}
.cap{display:block;font-size:14px;line-height:1.43;letter-spacing:-.224px;color:var(--ink2)}
.progress{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 24px}
.progress i{height:4px;border-radius:9999px;background:var(--track);overflow:hidden}
.progress i.on::after{content:"";display:block;height:100%;border-radius:inherit;background:var(--ink);transform-origin:left}

/* Buttons: Action Blue pills; every button presses to .95 */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:11px 22px;border-radius:9999px;font:600 17px/1.24 var(--text);letter-spacing:-.374px;text-align:center;transition:transform var(--sp-press-d) var(--sp-press),background-color .3s,color .3s,box-shadow .3s}
.btn svg{width:20px;height:20px}
.btn.pri{background:var(--blue);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 10px 22px -10px rgba(0,102,204,.7)}
.btn.sec{background:var(--sec-t);color:var(--blue)}
.btn.txt{color:var(--blue);min-height:44px;font-weight:500}
.btn.sm{display:inline-flex;width:auto;min-height:44px;padding:11px 22px}
.btn:disabled{background:#e4e4e9;color:#8e8e93;box-shadow:none;pointer-events:none}
.stack{display:grid;gap:12px}
.dock{position:sticky;bottom:calc(-32px - var(--bot));z-index:5;margin:24px -20px calc(-32px - var(--bot));padding:12px 20px calc(12px + var(--bot));background:rgba(245,245,247,.82);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-top:1px solid var(--line)}
.dock.split{display:flex;align-items:center;justify-content:space-between;gap:16px}
.dock.split .btn{width:auto;flex:none}
.dk-t b{display:block;font:600 21px/1.19 var(--display);letter-spacing:-.2px}
.dk-t small{display:block;font-size:14px;letter-spacing:-.224px;color:var(--ink2)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Status: pill chips, colour only means status */
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px 0 10px;border-radius:9999px;font:600 14px/1 var(--text);letter-spacing:-.224px;white-space:nowrap;flex:none}
.chip svg{width:14px;height:14px}
.chip.ok{background:var(--ok-t);color:var(--ok)}
.chip.bad{background:var(--bad-t);color:var(--bad)}
.chip.wait{background:var(--wait-t);color:var(--wait)}
.chip.info,.chip.mute{background:var(--mute-t);color:var(--ink2)}
.dot{display:block;width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.dot.live{position:relative}
.dot.live::after{content:"";position:absolute;inset:0;border-radius:50%;background:currentColor;animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{from{transform:scale(1);opacity:.55}to{transform:scale(2.8);opacity:0}}

/* Photos: each sits on its amenity colour, so a missing file is a colour block. Tints are flat, never gradients */
.pic{position:relative;display:block;overflow:hidden;border-radius:20px;background:var(--tile1);flex:none}
.pic img{display:block;width:100%;height:100%;object-fit:cover;transition:opacity .6s ease}
.pic img.wait{opacity:0}   /* photos still on their way fade in over their colour */
.pic.tint::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,var(--tint,.35))}
.zoomer{position:absolute;z-index:60;object-fit:cover;pointer-events:none}
.pic img[src$="/clubhouse.jpg"]{object-position:center 35%}
.pic img[src$="/snooker.jpg"]{object-position:center 30%}
.pic img[src$="/tt.jpg"]{object-position:center 65%}
.pic img[src$="/kids.jpg"]{object-position:65% center}
.hero{position:relative;height:var(--hh,320px);margin:calc(-8px - var(--top)) -20px 0}
.hero > .pic{position:absolute;inset:0;border-radius:0}
.hero > .pic img{transform-origin:50% 100%}
.hbar{position:absolute;left:12px;top:calc(var(--top) + 6px)}
.lv{display:inline-flex;align-items:center;gap:6px;font-size:14px;line-height:1.43;letter-spacing:-.224px;color:var(--ink2)}
.lv .dot{color:var(--ok)}
.lv.busy .dot{color:var(--wait)}
.lv.full .dot{color:var(--bad)}

/* Home: the clubhouse photo, the pass resting on its lower edge */
.hero.home{--hh:308px}
.hero.home > .pic{--tint:.45}
.hh-txt{position:absolute;left:20px;right:76px;bottom:100px}
.hh-txt .title{margin:0;color:#fff;font-size:40px}
.hh-txt .title span{color:rgba(255,255,255,.82);font-size:17px;letter-spacing:-.374px}
.hh-bell{position:absolute;right:12px;top:calc(var(--top) + 6px)}
.hh-bell svg{transform-origin:50% 12%}
.dotb{position:absolute;top:9px;right:9px;width:10px;height:10px;border-radius:50%;background:var(--bad);border:2px solid #fff}
/* the pass is an object: graphite with fine rings, leaning toward the pointer under a light that follows it */
.pass{position:relative;overflow:hidden;border-radius:24px;background:var(--graphite) var(--rings,none) no-repeat right -400px top -400px/800px 800px;color:#fff;padding:24px;box-shadow:var(--object);transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .8s var(--sp-soft)}
.pass::after,.balance::after{content:"";position:absolute;inset:0;z-index:0;border-radius:inherit;pointer-events:none;background:radial-gradient(340px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.15),transparent 60%);opacity:var(--glow,0);transition:opacity .5s}
.pass > *,.balance > *{position:relative;z-index:1}
.hero.home + .pass{margin-top:-84px}
.pass-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.brand{display:block;font:700 21px/1.19 var(--display);letter-spacing:-.02em}
.brand small{display:block;margin-top:2px;font:400 14px/1.43 var(--text);letter-spacing:-.224px;color:rgba(255,255,255,.62)}
.pass .chip{background:#fff}
.pass-mid{display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;align-items:center;margin-top:22px}
.pass-mid .av{box-shadow:0 0 0 2px rgba(255,255,255,.14)}
.pass-name{display:block;font:700 27px/1.12 var(--display);letter-spacing:-.022em}
.pass-meta{display:flex;gap:24px;margin-top:8px;font-size:13px;line-height:1.43;letter-spacing:-.1px;color:rgba(255,255,255,.62)}
.pass-meta b{display:block;font:600 17px/1.24 var(--text);letter-spacing:-.374px;color:#fff}
.pass .btn{margin-top:24px}
.pass .btn.pri,.balance .btn.pri{background:#fff;color:var(--ink);box-shadow:0 8px 20px -8px rgba(0,0,0,.6)}
.book-cta{margin-top:20px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:64%;gap:14px;overflow-x:auto;margin:0 -20px;padding:4px 20px 6px;scroll-snap-type:x mandatory;scroll-padding-inline:20px;overscroll-behavior-x:contain;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail li{min-width:0;scroll-snap-align:start}
.rcard{display:block}
.rcard .pic{aspect-ratio:4/3;box-shadow:0 10px 24px -14px rgba(0,0,0,.5)}
.rc-t{display:flex;flex-direction:column;gap:2px;padding:10px 2px 0}
.rc-t b{font:600 17px/1.24 var(--text);letter-spacing:-.374px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-n{font-size:14px;line-height:1.43;letter-spacing:-.224px;color:#6e6e73}
.wcard{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:24px;padding:22px 22px 22px 24px;background:var(--card);border-radius:24px;box-shadow:var(--lift)}
.wbal{display:block;margin-top:4px;font:700 38px/1.1 var(--display);letter-spacing:-.025em}
.admit{display:block;padding:24px;margin-top:16px;background:var(--card);border-radius:24px;box-shadow:var(--lift)}
.admit .chip{margin-bottom:12px}
.ad-h{display:block;font:600 21px/1.19 var(--display);letter-spacing:-.2px}
.ad-s{display:block;margin-top:4px;font-size:14px;line-height:1.43;letter-spacing:-.224px;color:var(--ink2)}
.ad-s b{color:var(--ink)}
.admit .btn{margin-top:16px}

/* Utility cards and lists */
.tickets{display:grid;gap:12px}
.bcard{display:flex;align-items:center;gap:16px;width:100%;padding:14px 16px 14px 14px;background:var(--card);border-radius:22px;text-align:left;box-shadow:var(--lift)}
.bcard .pic{width:68px;height:68px;border-radius:15px}
.bc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.bc-h{font:600 17px/1.24 var(--text);letter-spacing:-.374px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc-s{font-size:14px;line-height:1.43;letter-spacing:-.224px;color:var(--ink2)}
.bc-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.list{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--flat)}
.row{display:flex;align-items:center;gap:16px;width:100%;min-height:56px;padding:12px 16px;text-align:left;border-bottom:1px solid #f0f0f3;background:var(--card);transition:background-color .35s}
.row:last-child{border-bottom:0}
button.row:active{transform:none;background:#ececf0;transition:background-color 0s}
.row > svg{width:22px;height:22px;color:var(--ink2)}
.row .grow{flex:1;min-width:0}
.row b{display:block;font-weight:600}
.row small{display:block;font-size:14px;line-height:1.43;letter-spacing:-.224px;color:var(--ink2)}
.kv .row{justify-content:space-between}
.kv .row > span:first-child{color:var(--ink2)}
.kv .row b{text-align:right}
.av{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;overflow:hidden;background:var(--tile1);color:#fff;font:600 15px/1 var(--text);letter-spacing:0;flex:none}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.g{background:var(--chip);color:var(--ink)}
.av.lg{width:56px;height:56px;font-size:19px}
.av.xl{width:64px;height:64px;font-size:21px;background:#3a3a3c}
.tog{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 16px;border-radius:9999px;background:var(--sec-t);color:var(--blue);font:600 14px/1 var(--text);letter-spacing:-.224px;flex:none;transition:transform var(--sp-press-d) var(--sp-press),background-color .3s,color .3s}
.tog svg{width:15px;height:15px;stroke-width:2.6}
.tog[aria-pressed=true]{background:var(--blue);color:#fff;padding-left:12px}
.price{flex:none}

/* Amenities: photo cards; the detail page is a photo with a sheet over its lower edge */
/* one highlight per choice group, gliding to whatever was picked (JS places .pill under the pressed button) */
.pills{position:relative}
.pills > button{position:relative;z-index:1}
.pill{position:absolute;left:0;top:0;z-index:0;border-radius:9999px;background:var(--blue);box-shadow:0 8px 18px -8px rgba(0,102,204,.75);pointer-events:none;transition:left var(--sp-pill-d) var(--sp-pill),top var(--sp-pill-d) var(--sp-pill),width var(--sp-pill-d) var(--sp-pill),height var(--sp-pill-d) var(--sp-pill)}
.filters{display:flex;gap:2px;overflow-x:auto;margin:0 -20px 18px;padding:2px 20px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;min-height:40px;padding:0 16px;border-radius:9999px;font:500 15px/1 var(--text);letter-spacing:-.24px;color:var(--ink2);transition:transform var(--sp-press-d) var(--sp-press),color .3s}
.fchip[aria-pressed=true]{background:var(--blue);color:#fff}
.pilled > [aria-pressed=true]{background:transparent!important;box-shadow:none!important}
.chips .fchip{background:var(--card);box-shadow:var(--flat);color:var(--ink)}
.chips .fchip[aria-pressed=true]{background:var(--blue);color:#fff;box-shadow:0 8px 18px -8px rgba(0,102,204,.75)}
.acards{display:grid;gap:30px}
.acard{display:block}
.acard .pic{aspect-ratio:16/9;border-radius:24px;box-shadow:0 14px 30px -18px rgba(0,0,0,.55)}
.ac-t{display:flex;flex-direction:column;gap:2px;padding:12px 4px 0}
.ac-t b{font:700 21px/1.19 var(--display);letter-spacing:-.018em}
.ac-s{font-size:14px;line-height:1.43;letter-spacing:-.224px;color:#6e6e73}
.ac-r{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px}
.empty{text-align:center;padding:8px 0}
.empty .pic{width:100%;aspect-ratio:16/9;margin-bottom:24px}
.empty h2{font:600 21px/1.19 var(--display);letter-spacing:-.2px;margin-bottom:8px}
.empty p{color:var(--ink2);margin:0 auto 24px;max-width:32ch}
.sheetc{position:relative;margin:-30px -20px 0;padding:26px 20px 0;background:var(--page);border-radius:30px 30px 0 0}
.sheetc > .title{margin-top:0}
.sheetc > .lv{display:flex;margin:-6px 0 12px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#ececf0;border-radius:20px;overflow:hidden;margin:8px 0;box-shadow:var(--flat)}
.fact{background:var(--card);padding:16px 20px}
.fact.w{grid-column:1/-1}
.fact > span{display:block;font-size:13px;letter-spacing:-.1px;color:#6e6e73}
.fact b{display:block;margin-top:2px;font:650 21px/1.19 var(--display);letter-spacing:-.018em}
.flnote{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.43;letter-spacing:-.224px;color:var(--ink2);margin:12px 4px 0}
.flnote svg{width:18px;height:18px}
.rules{background:var(--card);border-radius:20px;padding:4px 20px;box-shadow:var(--flat)}
.rules li{padding:14px 0;border-bottom:1px solid #f0f0f3}
.rules li:last-child{border-bottom:0}

/* Booking flow */
.sum{display:flex;align-items:center;gap:16px;padding:14px;background:var(--card);border-radius:22px;margin-bottom:18px;box-shadow:var(--flat)}
.sum .pic{width:54px;height:54px;border-radius:14px}
.sum b{display:block;font-weight:600}
.sum small{display:block;font-size:14px;letter-spacing:-.224px;color:#6e6e73}
.dates{display:flex;gap:6px;overflow-x:auto;margin:0 -20px 12px;padding:4px 20px 10px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.date{flex:none;width:62px;height:80px;border-radius:9999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;transition:transform var(--sp-press-d) var(--sp-press),color .3s}
.date small{font-size:12px;font-weight:500;letter-spacing:-.12px;color:#6e6e73;transition:color .3s}
.date b{font:650 22px/1 var(--display);letter-spacing:-.02em}
.date[aria-pressed=true]{background:var(--blue);color:#fff}
.date[aria-pressed=true] small{color:rgba(255,255,255,.85)}
.slots{display:grid;gap:12px;margin-top:16px}
.slot{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px 12px;width:100%;padding:16px 20px;border-radius:20px;background:var(--card);text-align:left;box-shadow:var(--flat);transition:transform var(--sp-press-d) var(--sp-press),box-shadow .25s}
.slot .tm{font:650 21px/1.19 var(--display);letter-spacing:-.018em;transition:color .25s}
.slot .sl{font-size:14px;letter-spacing:-.224px;color:var(--ink2)}
.slot .sl.low{color:var(--wait);font-weight:600}
.slot .sl.full{color:var(--bad);font-weight:600}
.meter{grid-column:1/-1;height:4px;border-radius:9999px;background:var(--track);overflow:hidden}
.meter i{display:block;height:100%;border-radius:inherit;background:#aeaeb2;transform-origin:left;transition:background-color .25s}
.meter i.low{background:var(--wait)}
.meter i.full{background:var(--bad)}
.slot .fl{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:14px;letter-spacing:-.224px;color:var(--ink2)}
.slot .fl svg{width:16px;height:16px}
.slot[aria-pressed=true]{box-shadow:0 0 0 2px var(--blue),0 14px 30px -16px rgba(0,102,204,.6)}
.slot[aria-pressed=true] .tm{color:var(--blue)}
.slot[aria-pressed=true] .meter i:not(.low):not(.full){background:var(--blue)}
.slot:disabled{background:transparent;color:var(--ink3);box-shadow:inset 0 0 0 1px #e3e3e8}
.line{display:flex;gap:16px;align-items:flex-start;padding:16px;border-bottom:1px solid var(--soft)}
.line:last-child{border-bottom:0}
.ln-t{flex:1;min-width:0}
.ln-t b{display:block;font-weight:600}
.ln-t small{display:block;font-size:14px;line-height:1.43;letter-spacing:-.224px;color:var(--ink2)}
.ln-a{flex:none;font-weight:600}
/* segmented control: a grey track with a white thumb that slides */
.seg{display:inline-flex;gap:0;padding:3px;margin-top:12px;border-radius:9999px;background:var(--track)}
.seg button{min-height:38px;padding:0 14px;border-radius:9999px;font:500 14px/1 var(--text);letter-spacing:-.224px;white-space:nowrap;color:var(--ink2);transition:transform var(--sp-press-d) var(--sp-press),color .3s}
.seg button[aria-pressed=true],.seg .pill{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 10px rgba(0,0,0,.08)}
.seg.wide{display:flex;width:100%;margin:0 0 18px}
.seg.wide button{flex:1;padding:0 6px;text-align:center}
.totals{display:grid;gap:12px;margin-top:16px;padding:20px;background:var(--card);border-radius:22px;box-shadow:var(--flat)}
.tl{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.tl > span:first-child{color:var(--ink2)}
.tl.big > span:first-child{color:var(--ink);font-weight:600}
.tl.big .num{font:600 21px/1.19 var(--display);letter-spacing:-.2px}
.note{display:flex;gap:12px;padding:16px;margin-top:16px;border-radius:18px;background:var(--mute-t);color:var(--ink2);font-size:14px;line-height:1.43;letter-spacing:-.224px;text-align:left}
.note svg{width:20px;height:20px;flex:none}
.note.warn{background:var(--wait-t);color:var(--wait)}
.note.err{background:var(--bad-t);color:var(--bad)}
.paying{min-height:calc(100% - 40px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:40px}
.paying .lede{margin:0 auto}
.hg{position:relative;display:grid;place-items:center;width:88px;height:88px;border-radius:50%;background:var(--card);box-shadow:var(--lift);color:var(--ink);margin-bottom:28px}
.hg::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2.5px solid transparent;border-top-color:var(--blue);border-right-color:rgba(0,102,204,.35);animation:spin 1.1s cubic-bezier(.5,.15,.5,.85) infinite}
.hg svg{width:36px;height:36px;animation:turn 1.6s var(--eo) infinite}
@keyframes turn{0%,40%{transform:rotate(0)}60%,100%{transform:rotate(180deg)}}

/* Booking confirmed: the QR ticket is the product */
.cf-head{position:relative;text-align:center;padding-top:8px}
.cf-head .check{position:relative;z-index:1;width:60px;height:60px;margin:0 auto 14px;filter:drop-shadow(0 8px 14px rgba(8,122,85,.35))}
.cf-head .lede{margin:0 auto 24px}
.cf-fx{position:absolute;left:50%;top:38px;width:0;height:0;pointer-events:none}
.cf-fx i{position:absolute;left:-4px;top:-6px;width:8px;height:12px;border-radius:2px}
.cf-fx .ripple{left:-30px;top:-30px;width:60px;height:60px;border-radius:50%;border:2px solid var(--ok)}
.slotbar{position:relative;z-index:2;height:14px;border-radius:9999px;background:var(--ink);box-shadow:inset 0 -3px 0 #000}
.paper{overflow:hidden;margin:-7px -20px 0;padding:7px 32px 40px}
.tk-big{position:relative;background:var(--card);border-radius:0 0 24px 24px;padding:24px;box-shadow:0 0 0 1px rgba(0,0,0,.03),0 24px 50px -24px rgba(0,0,0,.35),0 6px 14px -6px rgba(0,0,0,.08)}
.tk-big.solo{border-radius:24px}
.tb-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.tb-top .chip{margin-left:60px}   /* beside the title when it fits, under it (lined up with the text) when it doesn't */
.tb-top .pic{width:48px;height:48px;border-radius:13px}
.tk-band{height:150px;margin:-24px -24px 20px;border-radius:0}
.tb-top .grow{flex:1 1 auto;min-width:0}
.tb-top b{display:block;font-weight:600}
.tb-top small{display:block;font-size:14px;letter-spacing:-.224px;color:#6e6e73}
/* the tear line, with the two notches a paper ticket has */
.perf{position:relative;height:0;margin:22px -24px;border-top:2px dashed #e3e3e8}
.perf::before,.perf::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--page)}
.perf::before{left:-11px}
.perf::after{right:-11px}
.qrwrap{position:relative;width:208px;margin:0 auto;background:#fff}
.qrwrap svg{width:100%;height:auto}
.qrwrap.ring{border-radius:16px;padding:10px;box-shadow:0 0 0 1px #ececf0}
.scanline{position:absolute;left:0;right:0;top:0;height:2px;background:var(--ink);opacity:0;pointer-events:none}
.tb-meta{display:flex;justify-content:space-between;gap:12px;margin-top:20px;font-size:12px;letter-spacing:-.12px;color:var(--ink2)}
.tb-meta b{display:block;font:600 17px/1.24 var(--text);letter-spacing:-.374px;color:var(--ink)}
.tb-meta span:last-child{text-align:right}
.gpass{margin-top:16px;padding:20px;background:var(--card);border-radius:24px;box-shadow:var(--lift)}
.gp-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.gp-top .grow{flex:1;min-width:0}
.gp-top b{display:block;font-weight:600}
.gp-top small{display:block;font-size:14px;line-height:1.43;letter-spacing:-.224px;color:var(--ink2)}
.gpass .note{margin-top:0}

/* Wallet */
.balance{position:relative;overflow:hidden;margin:8px 0 24px;padding:28px 24px 24px;border-radius:26px;background:var(--graphite) var(--rings,none) no-repeat left -400px bottom -400px/800px 800px;color:#fff;box-shadow:var(--object);transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .8s var(--sp-soft)}
.balance .cap{color:rgba(255,255,255,.62)}
.bal{display:flex;align-items:flex-end;margin:6px 0 8px;font:700 48px/1.1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bal .cur{font-size:30px;margin:0 4px 5px 0;line-height:1}
.od{display:inline-block;height:1.1em;overflow:hidden}
.ods{display:block;transform:translateY(calc(var(--d) * -1.1em));transition:transform .4s var(--eo)}
.ods span{display:block;height:1.1em;line-height:1.1em}
.balance .sub{font-size:14px;line-height:1.43;letter-spacing:-.224px;color:rgba(255,255,255,.62);margin-bottom:22px;max-width:32ch}
.txi{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;flex:none;background:#f0f0f3;color:var(--ink)}
.txi svg{width:20px;height:20px}
.txi.topup{background:var(--ok-t);color:var(--ok)}
.tx-a{flex:none;font-weight:600}
.tx-a.topup,.tx-a.refund{color:var(--ok)}
.amt{display:flex;align-items:center;justify-content:center;gap:4px;margin:32px 0 20px;padding-bottom:12px;border-bottom:2px solid var(--hair)}
.amt:focus-within{border-color:var(--focus)}
.amt .cur{font:600 34px/1 var(--display)}
.amt input{field-sizing:content;width:6ch;min-width:2ch;max-width:8ch;border:0;background:none;outline:none;font:600 56px/1.07 var(--display);letter-spacing:-.28px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.cfh{display:flex;align-items:center;gap:12px;padding-bottom:16px;margin-bottom:8px;border-bottom:1px solid var(--soft)}
.cfh .grow{flex:1;min-width:0}
.cfh b{display:block;font-weight:600}
.cfh small{display:block;font-size:12px;letter-spacing:-.12px;color:var(--ink2)}
.cfh .num{font:600 21px/1.19 var(--display);letter-spacing:-.2px}
.cfi{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--ok-t);color:var(--ok);flex:none}
.cfi svg{width:22px;height:22px}
.cfs{font:600 14px/1.29 var(--text);letter-spacing:-.224px;color:var(--ink2);margin:20px 0 8px}
.upis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.upi{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:84px;padding:8px 4px;border-radius:16px;background:var(--pearl);border:2px solid #ececf0;font:500 12px/1.2 var(--text);letter-spacing:-.12px;color:var(--ink2);text-align:center;transition:transform var(--sp-press-d) var(--sp-press),border-color .25s,background-color .25s}
.upi svg{width:34px;height:34px;border-radius:9px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cfm .pmk{width:36px;height:36px;flex:none;border-radius:10px}
.cfm small{display:block;font-size:12px;color:var(--ink2);font-weight:400}
.marks{display:flex;gap:4px;margin-top:4px}
.marks svg{width:30px;height:19px}
.tx-r{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.tx-r small{font-size:12px;color:var(--ink3)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cfm{border:2px solid #ececf0;border-radius:16px;background:var(--pearl);margin-bottom:8px;transition:border-color .25s,background-color .25s}
.upi[aria-pressed=true],.cfm[aria-pressed=true]{border-color:var(--blue);background:#f2f7fd}
.cfstate{text-align:center;padding:16px 0 8px}
.pd-card{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pd-card .pd-wide{grid-column:1/-1}
.cfdet{margin-top:16px}

.cfstate .hg{margin:0 auto 16px}
.cfstate p{color:var(--ink2);margin:0 auto 24px;max-width:30ch}
.bigic{display:grid;place-items:center;width:72px;height:72px;border-radius:50%;margin:0 auto 16px;background:var(--page);color:var(--ink)}
.bigic svg{width:32px;height:32px}
.bigic.bad{background:var(--bad-t);color:var(--bad)}
.bigic.ok{background:var(--ok-t);color:var(--ok)}

/* Sheets and fields */
.sheets{position:absolute;inset:0;z-index:80}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.28)}
/* the sheet floats inside the screen's rounded corners and can be dragged down to close */
.sheet{position:absolute;left:8px;right:8px;bottom:8px;max-height:calc(100% - var(--top) - 24px);overflow-y:auto;padding:8px 22px calc(18px + var(--bot));background:var(--card);border-radius:34px 34px 44px 44px;box-shadow:0 -10px 40px rgba(0,0,0,.18);scrollbar-width:none;overscroll-behavior:contain;-webkit-user-select:none;user-select:none}
.grab{position:relative;width:40px;height:5px;margin:0 auto 18px;border-radius:9999px;background:#d8d8de;touch-action:none;cursor:grab}
.grab::before{content:"";position:absolute;left:-40px;right:-40px;top:-8px;bottom:-16px}   /* a bigger handle to catch the drag */
.sheet h2{font:700 22px/1.2 var(--display);letter-spacing:-.018em;margin-bottom:8px}
.sheet .sub{color:#6e6e73;margin-bottom:20px}
.sheet .btn + .btn{margin-top:12px}
.center{text-align:center}
.field{display:block;margin-bottom:16px}
.field > span{display:block;font:600 14px/1.29 var(--text);letter-spacing:-.224px;color:var(--ink2);margin-bottom:8px}
.input{width:100%;height:52px;padding:0 16px;border-radius:14px;border:1px solid #d2d2d7;background:#fff;font:400 17px/1.2 var(--text);letter-spacing:-.374px;outline:none;transition:border-color .2s,box-shadow .25s}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,102,204,.16)}
.input.bad{border-color:var(--bad);box-shadow:0 0 0 4px rgba(180,40,40,.12)}
textarea.input{height:120px;padding:14px 16px;resize:none;line-height:1.44}
.field > .phone{display:flex;align-items:center;gap:8px;margin:0;font:inherit;letter-spacing:inherit;color:inherit}
.cc{display:grid;place-items:center;height:52px;padding:0 16px;border-radius:14px;background:#ececf0;font-weight:500;flex:none}
.ferr{display:flex;gap:6px;align-items:center;color:var(--bad);font-size:14px;letter-spacing:-.224px;margin:-4px 0 12px}
.ferr svg{width:18px;height:18px}
.checkl{display:flex;gap:12px;align-items:center;min-height:48px;margin-bottom:8px;cursor:pointer}
.checkl input{width:22px;height:22px;accent-color:var(--blue);flex:none}
.checkl small{display:block;font-size:14px;letter-spacing:-.224px;color:var(--ink2)}
.opts{display:grid;gap:8px;margin-bottom:16px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:14px 20px;border-radius:20px;background:var(--card);border:2px solid #ececf0;text-align:left;transition:transform var(--sp-press-d) var(--sp-press),border-color .25s,background-color .25s}
.opt b{display:block;font-weight:600}
.opt small{display:block;font-size:14px;letter-spacing:-.224px;color:var(--ink2)}
.opt[aria-checked=true]{border-color:var(--blue);background:#f2f7fd}

/* Sign in: the clubhouse photo above a sheet */
.screen.auth{display:flex;flex-direction:column;padding:0}
.auth-ph{position:relative;flex:0 0 var(--ph,42%);min-height:200px}
.auth-ph > .pic{position:absolute;inset:0;border-radius:0}
.auth-back{position:absolute;left:12px;top:calc(var(--top) + 6px)}
.auth-wm{position:absolute;left:20px;bottom:50px;color:#fff;font:700 32px/1.1 var(--display);letter-spacing:-.025em}
.auth-sheet{position:relative;flex:1 0 auto;display:flex;flex-direction:column;margin-top:-30px;padding:26px 20px calc(var(--bot) + 32px);background:var(--page);border-radius:30px 30px 0 0}
.auth-sheet > .dock{margin-top:auto}
.otp{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:8px 0 16px}
.otp input{width:100%;height:60px;padding:0;text-align:center;font:650 28px/1 var(--display);letter-spacing:0;border-radius:14px;border:1.5px solid #d2d2d7;background:#fff;outline:none;caret-color:var(--blue);font-variant-numeric:tabular-nums;transition:border-color .2s,background-color .2s,box-shadow .2s}
.otp input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,102,204,.16)}
.otp input.on{border-color:var(--blue);background:#f0f6fd}
.otp.bad input{border-color:var(--bad);background:#fff;animation:shake .38s}
/* complete code: the boxes fly together into one pill, which turns into the success tick */
.otp-pill{position:absolute;left:50%;top:50%;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:58px;padding:0 24px;border-radius:999px;background:var(--blue);color:#fff;font:600 17px/1 var(--text);letter-spacing:-.374px;white-space:nowrap;transform:translate(-50%,-50%);overflow:hidden}
.otp-pill.ok{width:58px;padding:0;background:#087A55}
.otp-pill svg{width:30px;height:30px;flex:none}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.resend{font-size:14px;letter-spacing:-.224px;color:var(--ink2);min-height:24px}
.smsbar{display:flex;align-items:center;gap:12px;width:100%;margin-top:24px;padding:8px 16px;min-height:60px;border-radius:18px;background:var(--card);box-shadow:var(--lift);text-align:left;color:var(--ink2)}
.smsbar small{display:block;font-size:12px;letter-spacing:-.12px}
.smsbar b{margin-left:auto;font:600 21px/1 var(--display);letter-spacing:.06em;color:var(--ink);font-variant-numeric:tabular-nums}
.smsbar svg{width:22px;height:22px;color:var(--ink)}
/* Splash: the clubhouse at night, a slow push in, the name rising once */
.screen.splash{padding:0;background:#000}
.splash-hit{position:absolute;inset:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 32px;color:#fff;text-align:center}
.splash-hit:active{transform:none}
.splash-ph{position:absolute;inset:0;border-radius:0;--tint:.45}
.splash-ph img{animation:kb 10s linear both}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08)}}
/* the name arrives letter by letter, each one sharpening out of a blur */
.wm{position:relative;display:block;font:700 54px/1.08 var(--display);letter-spacing:-.03em}
.wm span{display:inline-block;animation:letter .9s calc(.25s + var(--i) * 60ms) cubic-bezier(.2,.8,.2,1) both}
@keyframes letter{from{opacity:0;transform:translateY(.42em) scale(.94);filter:blur(12px)}to{opacity:1;transform:none;filter:blur(0)}}
.splash .by{position:relative;display:block;max-width:26ch;margin-top:14px;font:400 17px/1.44 var(--text);letter-spacing:-.374px;color:rgba(255,255,255,.86);animation:rise .7s .8s var(--eo) both}

.qc-top b{display:block;font:700 21px/1.19 var(--display);letter-spacing:-.018em}
.qc-top small{display:block;font-size:14px;letter-spacing:-.224px;color:rgba(255,255,255,.62)}
/* a glint crosses the name strip every few seconds: the pass is live, not a picture. It never crosses the code, so scanning is never affected */
.qc-top::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.2) 50%,transparent);transform:translateX(-120%) skewX(-12deg);animation:glint 4.8s 1.4s cubic-bezier(.4,0,.2,1) infinite;pointer-events:none}
@keyframes glint{0%{transform:translateX(-120%) skewX(-12deg)}28%,100%{transform:translateX(330%) skewX(-12deg)}}
.qc-code{padding:24px 40px 8px}
.qc-code svg{width:100%;height:auto}
.qc-valid{text-align:center;padding:4px 0 24px;color:var(--ink2);font-size:14px;letter-spacing:-.224px}

.qr-help{display:flex;gap:12px;margin-top:24px;color:var(--ink2);font-size:14px;line-height:1.43;letter-spacing:-.224px}
.qr-help svg{width:22px;height:22px;color:var(--ink)}
.bloom{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:10}

/* Scanner result: full-bleed status tile */
#overlay{position:absolute;inset:0;z-index:95;pointer-events:none}
.scanov{position:absolute;inset:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 28px;text-align:center;color:#fff;background:var(--ok);pointer-events:auto}
.scanov:active{transform:none}
.scanov.bad{background:var(--bad)}
.scanov.shot{background:rgba(29,29,31,.96)}
.scanov.shot .h{font-size:34px}
/* share sheet: app icons, the message as it arrives, and the guest's live pass page */
.share-apps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:20px}
.sapp{display:flex;flex-direction:column;align-items:center;gap:7px;min-height:86px;padding:4px 0;border:0;background:none;font:400 12px/1.2 var(--text);letter-spacing:-.12px;color:var(--ink);text-align:center}
.sapp svg{width:54px;height:54px;transition:transform .12s var(--eo)}
.sapp:active svg{transform:scale(.92)}
.shotnote{display:flex;gap:10px;align-items:flex-start;margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--soft);font-size:14px;line-height:1.4;letter-spacing:-.15px;color:var(--ink)}

.chat{border:1px solid var(--hair);border-radius:16px;overflow:hidden;margin-bottom:16px}
.chat-h{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f6f6f6;border-bottom:1px solid var(--hair)}

.chat-h b{display:block;font-size:15px;letter-spacing:-.2px}
.chat-h small{display:block;font-size:12px;color:var(--ink2)}
.chat-b{padding:14px 12px 16px;background:#efeae2}
.chat.sms .chat-b{background:#fff}
.bub{margin-left:auto;max-width:88%;padding:5px;border-radius:12px 12px 4px 12px;background:#d9fdd3;color:#111b21;font-size:14px;line-height:1.38;letter-spacing:-.1px}
.chat.sms .bub{border-radius:18px 18px 4px 18px;background:#e9e9eb}
.lp{display:block;overflow:hidden;border-radius:9px;background:rgba(0,0,0,.05)}
.lp .pic{height:92px;border-radius:0}
.lp b{display:block;padding:8px 10px 0;font-size:14px}
.lp small{display:block;padding:2px 10px 9px;font-size:12px;color:#54656f}
.bub p{padding:7px 5px 2px}
.bub .meta{display:flex;justify-content:flex-end;align-items:center;gap:3px;padding:0 5px 1px;font-size:11px;color:#667781}
.bub .meta svg{width:16px;height:11px}
.mail{border:1px solid var(--hair);border-radius:16px;padding:16px;margin-bottom:16px;background:#fff;font-size:14px;line-height:1.45}
.mail .from{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mail .from small{display:block;color:var(--ink2);font-size:12px}
.mail h3{font:600 17px/1.3 var(--text);margin-bottom:8px}
.gview{border:1px solid var(--hair);border-radius:18px;overflow:hidden;margin-bottom:16px;background:#fff}
.gv-url{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;background:#f2f2f7;font-size:12px;color:var(--ink2)}
.gv-url svg{width:12px;height:12px}
.gv-page{padding:18px 18px 20px;text-align:center}
.gv-page .brand{font:600 15px/1.2 var(--display)}
.gv-page .brand small{display:block;font-weight:400;font-size:12px;color:var(--ink2)}
.gv-page h3{font:600 28px/1.15 var(--display);letter-spacing:-.3px;margin:14px 0 2px}
.gv-page .qrwrap{width:172px;margin:16px auto 6px}
.gv-count{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.gv-facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;text-align:left}
.gv-facts span{display:block;font-size:12px;color:var(--ink2)}
.gv-facts b{display:block;margin-top:2px;font-size:15px}
.gv-page .shotnote{text-align:left}
.scanov .big{display:grid;place-items:center;width:72px;height:72px;border-radius:50%;border:2px solid #fff;margin-bottom:28px}
.scanov .big svg{width:36px;height:36px}
.scanov .h{display:block;font:600 44px/1.07 var(--display);letter-spacing:-.4px}
.scanov .p{display:block;margin-top:16px;max-width:24ch;font:400 21px/1.3 var(--display);letter-spacing:-.2px}
.scanov .k{display:block;margin-top:32px;font-size:14px;letter-spacing:-.224px}
/* toasts grow out of the island at the top of the phone */
.toast{position:absolute;left:11px;right:11px;top:11px;z-index:96;display:flex;align-items:center;gap:12px;min-height:58px;padding:12px 20px 12px 13px;border-radius:29px;background:#000;color:#fff;font-size:15px;line-height:1.35;letter-spacing:-.2px;box-shadow:0 14px 34px rgba(0,0,0,.28)}
.toast .ti{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#1f9d6a;flex:none}
.toast.bad .ti{background:#d33a3a}
.toast svg{width:18px;height:18px;stroke-width:2.6}

/* Tab bar: a floating glass capsule; the highlight glides to the chosen tab */
.tabbar{position:absolute;left:16px;right:16px;bottom:calc(var(--bot) + 6px);z-index:40;display:grid;grid-template-columns:repeat(5,1fr);height:64px;padding:6px;border-radius:9999px;background:rgba(250,250,252,.72);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 0 0 .5px rgba(0,0,0,.08),0 12px 34px rgba(0,0,0,.14)}
.tab-pill{position:absolute;left:6px;top:6px;bottom:6px;width:calc((100% - 12px) / 5);border-radius:9999px;background:rgba(0,102,204,.1);transform:translateX(calc(var(--ti,0) * 100%));transition:transform var(--sp-pill-d) var(--sp-pill)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:9999px;font:500 11px/1 var(--text);letter-spacing:-.06px;color:#6e6e73}
.tab svg{width:24px;height:24px;transition:stroke-width .2s}
.tab[aria-current=page]{color:var(--blue);font-weight:600}

.steps{margin-top:16px;padding:20px;background:var(--card);border-radius:22px;box-shadow:var(--flat)}
.steps h3{font:600 17px/1.24 var(--text);letter-spacing:-.374px;margin-bottom:16px}
.step{position:relative;display:flex;gap:12px;padding-bottom:16px}
.step:last-child{padding-bottom:0}
.step i{position:relative;z-index:1;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;border:2px solid var(--chip);background:#fff;color:#fff;flex:none}
.step i svg{width:13px;height:13px}
.step.done i{background:var(--ok);border-color:var(--ok)}
.step.now i{border-color:var(--wait)}
.step:not(:last-child)::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--chip)}
.step.done:not(:last-child)::before{background:var(--ok)}
.step b{display:block;font-weight:600}
.step small{display:block;font-size:14px;letter-spacing:-.224px;color:var(--ink2)}
.me{display:flex;align-items:center;gap:16px;width:100%;padding:18px 20px;margin-bottom:24px;border-radius:24px;background:var(--card);text-align:left;box-shadow:var(--lift)}
.me .grow{flex:1;min-width:0}
.me b{display:block;font:600 21px/1.19 var(--display);letter-spacing:-.2px}
.me small{display:block;font-size:14px;letter-spacing:-.224px;color:var(--ink2)}
.me > svg{width:20px;height:20px;color:var(--ink3)}
.nt{align-items:flex-start}
.nt .txi{margin-top:2px}
.nt > svg:last-child{width:18px;height:18px;color:#c7c7cc;align-self:center}
.nd-head{text-align:center;padding-top:8px}
.nd-head .lede{margin:0 auto 24px}
.nd-ic{width:72px;height:72px;margin:0 auto 16px}
.nd-ic svg{width:32px;height:32px}
.ud{width:10px;height:10px;border-radius:50%;background:var(--ink);margin-top:8px;flex:none}
details.faq{border-bottom:1px solid var(--soft)}
details.faq:last-child{border-bottom:0}
details.faq summary{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:0 16px;font-weight:600;cursor:pointer;list-style:none}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary svg{width:18px;height:18px;color:var(--ink3);transition:transform .2s var(--eo)}
details.faq[open] summary svg{transform:rotate(90deg)}
details.faq p{padding:0 16px 16px;color:var(--ink2)}
@supports selector(::details-content){   /* answers slide open instead of snapping */
  details.faq{interpolate-size:allow-keywords}
  details.faq::details-content{block-size:0;overflow:hidden;transition:block-size .45s cubic-bezier(.2,.8,.2,1),content-visibility .45s allow-discrete}
  details.faq[open]::details-content{block-size:auto}
}
.visit{margin:0 0 24px}
.visit .pic{aspect-ratio:3/2;margin-bottom:12px}
.visit figcaption{font-size:14px;line-height:1.43;letter-spacing:-.224px;color:var(--ink2)}

/* Demo controls: white card, dark utility buttons */
.demo{width:300px;flex:none;align-self:center;padding:24px;border-radius:24px;background:var(--card);box-shadow:var(--lift)}
.demo h2{font:600 21px/1.19 var(--display);letter-spacing:-.2px}
.demo > p,.demo-in > p{font-size:14px;line-height:1.43;letter-spacing:-.224px;color:var(--ink2);margin-top:8px}
.demo h3,.demo-in h3{font:600 14px/1.29 var(--text);letter-spacing:-.224px;color:var(--ink2);margin:24px 0 8px}
.dbtn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:44px;padding:8px 15px;margin-bottom:8px;border-radius:8px;background:var(--ink);color:#fff;font:400 14px/1.29 var(--text);letter-spacing:-.224px;text-align:left;transition:transform .12s var(--eo)}
.dbtn svg{width:18px;height:18px}
.dtog{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;padding:4px 0;border-bottom:1px solid var(--soft);font:400 14px/1.29 var(--text);letter-spacing:-.224px;text-align:left}
.dtog:active{transform:none}
.sw{position:relative;width:51px;height:31px;border-radius:9999px;background:#e3e3e8;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:9999px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.08);transition:transform var(--sp-pill-d) var(--sp-pill),width var(--sp-pill-d) var(--sp-pill)}
.dtog[aria-pressed=true] .sw{background:var(--blue)}

.dtog:active .sw::after{width:33px}   /* the knob stretches under the finger */
.dtog[aria-pressed=true]:active .sw::after{transform:translateX(14px)}
.vstat{display:flex;align-items:center;gap:8px;font:600 14px/1.29 var(--text);letter-spacing:-.224px}
.vstat .dot{color:var(--ink3)}
.vstat .dot.in{color:var(--ok)}
.demo-in{padding-bottom:8px}

@media (prefers-reduced-motion:reduce){

  .splash-ph img{animation:none}
  .dot.live{animation:none}
}

/* ---------- My bookings and booking details ---------- */
function scrBookings() {
  const key = b => b.date + String(b.h).padStart(2, '0');
  const up = upcoming(), hist = S.bookings.filter(b => b.st !== 'confirmed' && b.st !== 'inuse').sort((x, y) => key(y).localeCompare(key(x)));
  const list = S.bkTab === 'up' ? up : hist;
  const tab = (v, l) => `<button role="tab" data-act="bkTab" data-arg="${v}" aria-selected="${S.bkTab === v}" aria-pressed="${S.bkTab === v}">${l}</button>`;
  return {
    tabs: true, tab: 'bookings', label: 'My bookings',
    html: `${TF}<h1 class="title">My bookings</h1>
<div class="seg wide pills" role="tablist" aria-label="Bookings">${tab('up', 'Upcoming')}${tab('hist', 'History')}</div>
${list.length ? `<div class="tickets">${list.map(ticketHTML).join('')}</div>`
      : S.bkTab === 'up' ? `<div class="empty">${amPic(amOf('badminton'))}<h2>No upcoming bookings</h2><p>Book a court, the pool or the gym. Your QR code appears here.</p><button class="btn pri" data-act="book">Book amenity</button></div>`
        : '<p class="cap">Past bookings appear here.</p>'}`,
    after(el, re) { stagger($$('.tickets > *, .empty', el), re ? 0 : 80); },
  };
}
function personRow(p) {
  const how = 'paid from wallet';
  return `<div class="row">${av(p.n, isGuest(p) ? ' g' : '')}<span class="grow"><b>${p.n}</b><small>${p.me ? 'You' : typeLabel(p.t)}, ${how}</small></span><span class="num price">${rs(p.p || 0)}</span></div>`;
}
const histLine = b => b.st === 'used' ? `Used on ${fmtDay(b.date)}. Thanks for visiting.` : b.st === 'cancelled' ? `Cancelled${b.why ? `: ${b.why.toLowerCase()}` : ''}. The full amount went back to your wallet.` : 'Expired. The slot ended without a scan.';
function refundSteps(b) {
  const k = ['initiated', 'processing', 'completed'].indexOf(b.refund), all = b.refund === 'completed';
  const steps = [['Initiated', 'Cancellation received'], ['Processing', 'Crediting your wallet'], ['Completed', 'The money is in your wallet']];
  return `<section class="steps" aria-live="polite"><h3>Refund of ${rs(b.paid)} to your wallet</h3>${steps.map(([t, s], i) => {
    const done = all || i < k, now = !all && i === k;
    return `<div class="step${done ? ' done' : now ? ' now' : ''}"><i>${done ? ic('check') : ''}</i><span><b>${t}</b><small>${s}</small></span></div>`;
  }).join('')}</section>`;
}
function scrBooking({ id }) {
  const b = bk(id) || S.bookings[0], a = amOf(b.am), live = b.st === 'confirmed' || b.st === 'inuse';
  const canCancel = b.st === 'confirmed' && hoursUntil(b) >= 2;
  return {
    label: 'Booking details',
    html: `${bar('Booking details')}
<div class="tk-big solo"><div class="tb-top">${amPic(a)}<span class="grow"><b>${a.name}</b><small>${dayWord(b.date)}, ${span(b)}</small></span>${statusChip(b)}</div>
<div class="perf" aria-hidden="true"></div>
${live ? `<div class="qrwrap">${qrSVG('CLUBONE:B:' + b.id + ':' + sig(b.id), 'Booking QR code')}</div><p class="fine">${b.st === 'inuse' ? 'You are admitted. Scan the same QR at the door to leave.' : `Scan at the ${a.name.toLowerCase()} door from ${hm(b.h - .25)}.`}</p>` : `<p class="fine" style="margin:0">${histLine(b)}</p>`}

<div class="list">${b.people.map(personRow).join('')}</div>
${b.people.some(isGuest) && live ? `<button class="btn sec" style="margin-top:12px" data-go="guests">${ic('userplus')}Guest passes</button>` : ''}
${b.refund ? refundSteps(b) : ''}
${b.st === 'confirmed' ? (canCancel
      ? `<button class="btn sec" style="margin-top:24px" data-act="askCancel" data-arg="${b.id}">Cancel booking</button><p class="fine">Free cancellation until ${dayWord(b.date)}, ${hm(b.h - 2)}.</p>`
      : `<div class="note warn">${ic('clock')}<span>Cancellation closed at ${hm(b.h - 2)}. Bookings can be cancelled up to 2 hours before the slot.</span></div>`) : ''}`,

Object.assign(ACT, {
  bkTab(k) { S.bkTab = k; rerender(); },
  askCancel(id) {
    const b = bk(id), a = amOf(b.am);
    openSheet(`<h2>Cancel this booking?</h2><p class="sub">${a.name}, ${dayWord(b.date)}, ${span(b)}.</p><div class="totals" style="margin:0 0 24px"><div class="tl big"><span>Refund to your wallet</span><span class="num">${rs(b.paid)}</span></div><div class="tl"><span>Guest passes</span><span>${b.people.some(isGuest) ? 'Revoked' : 'None'}</span></div></div><p class="cfs" style="margin-top:0">Why are you cancelling?</p><div class="opts" role="radiogroup" aria-label="Reason for cancelling" id="why">${CANCEL_WHY.map((w, i) => `<button class="opt" role="radio" aria-checked="false" data-act="pickWhy" data-arg="${i}"><b>${w}</b></button>`).join('')}</div><label class="field" id="whyother" hidden><span>Tell the club why</span><textarea class="input" placeholder="A few words"></textarea></label><p class="ferr" id="whyerr" hidden></p><div class="stack"><button class="btn pri" data-act="doCancel" data-arg="${id}">Cancel booking</button><button class="btn txt" data-act="closeSheet">Keep booking</button></div>`);
  },
  doCancel(id) {
    const b = bk(id), a = amOf(b.am), sel = $('#why .opt[aria-checked=true]'), err = $('#whyerr');
    if (!sel) { err.hidden = false; err.innerHTML = ic('alert') + 'Choose a reason for cancelling.'; return; }
    let why = CANCEL_WHY[+sel.dataset.arg];
    if (why === 'Other') { why = $('#whyother textarea').value.trim(); if (why.length < 3) { err.hidden = false; err.innerHTML = ic('alert') + 'Tell the club why in a few words.'; $('#whyother textarea').focus(); return; } why = esc(why); }
    b.why = why;
    b.st = 'cancelled'; b.refund = b.paid ? 'initiated' : null;
    if (b.app) syncBookings();
    closeSheet(); rerender(); toast(b.paid ? 'Booking cancelled. Your refund has started.' : 'Booking cancelled');
    if (!b.paid) return;
    setTimeout(() => { b.refund = 'processing'; if (curPath === 'booking/' + id) rerender(); }, 1300);
    setTimeout(() => {
      b.refund = 'completed'; S.wallet += b.paid;
      S.txns.unshift({ id: 'TX-' + (9400 + S.txns.length), k: 'refund', t: `Refund: ${a.name.toLowerCase()} booking cancelled`, d: STAMP, a: b.paid, ref: b.id, m: 'Wallet' });
      S.notes.unshift({ t: 'Refund completed', b: `₹${inr(b.paid)} for your cancelled ${a.name.toLowerCase()} booking is back in your wallet.`, d: 'Today, ' + CLOCK, ic: 'refund', unread: true, ref: b.id });
      if (curPath === 'booking/' + id) rerender();
      toast(`₹${inr(b.paid)} refunded to your wallet`);
    }, 3000);
  },
});

}
function scrWallet() {
  const k = S.wTab, list = S.txns.filter(t => k === 'all' || t.k === k), roll = S.roll, L = ledger();
  const tabs = [['all', 'All'], ['topup', 'Top-ups'], ['debit', 'Debits'], ['refund', 'Refunds']];
  return {
    tabs: true, tab: 'wallet', label: 'Wallet',
    html: `${TF}<h1 class="title">Wallet</h1>
<section class="balance" aria-label="Wallet balance"><span class="cap">Balance</span><span class="bal" id="bal">${odoHTML(roll ? roll.from : S.wallet)}</span><p class="sub">Pays for bookings, guest charges and membership fees. The balance never goes below zero.</p><button class="btn pri sm" data-go="addmoney">Add money</button></section>
<div class="seg wide pills" role="tablist" aria-label="Transactions">${tabs.map(([v, l]) => `<button role="tab" data-act="wTab" data-arg="${v}" aria-selected="${k === v}" aria-pressed="${k === v}">${l}</button>`).join('')}</div>
<div class="list">${list.length ? list.map(t => txRow(t, L.after[t.id])).join('') : '<p class="row cap">Nothing here yet.</p>'}</div>

function cfMethods(n) {
  const m = S.cfm;
  return `<div class="cfh"><span class="cfi">${ic('shield')}</span><span class="grow"><b>Cashfree checkout</b><small>Paying The Clubhouse, secured by Cashfree</small></span><b class="num">${rs(n)}</b></div>

function cfDetail(m, n) {
  if (m === 'Card') return cardFields();

  return `<p class="fine" style="margin:0">Tap Pay to open ${m} and approve ${rs(n)}.</p>`;
}
function topupDone(n, method, open) {
  const from = S.wallet;
  S.wallet += n;
  S.txns.unshift({ id: 'TX-' + (9500 + S.txns.length), k: 'topup', t: 'Wallet top-up', d: STAMP, a: n, ref: 'CF-ORD-' + (78100 + S.txns.length), m: ['Card', 'Net banking'].includes(method) ? method : 'UPI' });
  S.notes.unshift({ t: 'Wallet top-up received', b: `₹${inr(n)} was added to your wallet.`, d: 'Today, ' + CLOCK, ic: 'wallet', unread: true });
  const msg = `₹${inr(n)} added to your wallet`;
  if (!open) { toast(msg); rerender(); return; }
  closeSheet();
  if (S.returnTo) { S.returnTo = null; back(); } else { S.roll = { from, to: S.wallet }; go('wallet'); }
  toast(msg);
}
Object.assign(ACT, {
  wTab(k) { S.wTab = k; rerender(); },
  receipt(id) {
    const t = S.txns.find(x => x.id === id);
    if (!t) return;
    const rows = [['Date', t.d], ['Paid by', t.m], ['Reference', t.ref], ['Balance after', rs(ledger().after[t.id])], ['Status', t.k === 'refund' ? 'Completed' : 'Paid'], ['Receipt no.', 'RC-' + t.id.slice(3)]];
    openSheet(`<div class="bigic${t.k === 'debit' ? '' : ' ok'}">${ic('receipt')}</div><h2 class="center num" style="font-size:36px">${t.k === 'debit' ? '−' : '+'}${rs(t.a)}</h2><p class="sub center">${t.t}</p><div class="list kv">${rows.map(([l, v]) => `<div class="row"><span>${l}</span><b>${v}</b></div>`).join('')}</div><button class="btn sec" style="margin-top:16px" data-act="closeSheet">Done</button>`);
  },
  amtChip(x) { S.topAmt = +x; rerender(); pop($('.chips [aria-pressed=true]')); buzz(8); },
  topup() {
    const n = S.topAmt;
    if (!(n >= 100 && n <= 50000)) { const e = $('#amterr'); e.hidden = false; e.innerHTML = `${ic('alert')}Add between ₹100 and ₹50,000.`; return; }
    openSheet(cfMethods(n));
  },
  cfPick(x) { S.cfm = x; sheetBody(cfMethods(S.topAmt)); },
  cfRetry() { sheetBody(cfMethods(S.topAmt)); },
  cfPay() {
    const n = S.topAmt, method = S.cfm, bad = payCheck($('#cfdet'), method), err = $('#cferr');

    sheetBody(`<div class="cfstate"><span class="hg">${ic('hour')}</span><h2>Waiting for your bank</h2><p>Approve the payment in ${['Card', 'Net banking'].includes(method) ? 'your bank’s page' : method}. If money leaves your account, it reaches your wallet even if you close this screen.</p></div>`);
    setTimeout(() => {
      const open = !sheetsEl.hidden && !!$('.cfstate', sheetsEl);

        if (open) sheetBody(`<div class="cfstate"><div class="bigic bad">${ic('xc')}</div><h2>Payment failed</h2><p>Nothing was added to your wallet. Your bank declined the payment.</p><div class="stack"><button class="btn pri" data-act="cfRetry">Try again</button><button class="btn txt" data-act="closeSheet">Close</button></div></div>`);

      }
      topupDone(n, method, open);

  calling() { closeSheet(); toast('Calling the club office'); },
  reportProblem() {
    openSheet(`<h2>Report a problem</h2><p class="sub">The club office replies by SMS, usually within a day.</p><label class="field"><span>What went wrong?</span><textarea class="input" id="rp" placeholder="For example: the pool door did not open for booking CB-261028-0142"></textarea></label><p class="ferr" id="rperr" hidden></p><button class="btn pri" data-act="sendReport">Send report</button>`);
  },
  sendReport() {
    if ($('#rp').value.trim().length < 5) { const e = $('#rperr'); e.hidden = false; e.innerHTML = `${ic('alert')}Describe the problem in a few words.`; return; }
    closeSheet(); toast('Report sent. The club office will reply by SMS.');
  },
  askSignout() {
    openSheet('<h2>Sign out of ClubOne?</h2><p class="sub">Your bookings, QR codes and wallet stay safe. Sign in again with your mobile number and an OTP.</p><button class="btn pri" data-act="doSignout">Sign out</button><button class="btn txt" data-act="closeSheet">Stay signed in</button>');
  },
  doSignout() { S.signed = false; closeSheet(true); go('signin', true); },
});

/* ---------- Demo controls: simulate the scanner stations ---------- */
const TOGGLES = [['expired', 'Membership expired']];
const demoInner = () => TOGGLES.map(([k, l]) => `<button class="dtog" data-act="toggle" data-arg="${k}" aria-pressed="${!!S[k]}"><span>${l}</span><span class="sw" aria-hidden="true"></span></button>`).join('');
function renderDemo() {
  $('#demo').innerHTML = `<h2>Demo controls</h2><p>Kaizen ClubOne member app for The Clubhouse. Sample data only. Turn this on to show what a member with an expired membership sees.</p>${demoInner()}`;
  if (curPath === 'demo') rerender();
}
function scrDemo() {
  return { label: 'Demo controls', html: `${bar('Demo controls')}<div class="demo-in"><p>Turn this on to show what a member with an expired membership sees.</p>${demoInner()}</div>` };
}
function afterScan() { renderDemo(); if (curPath !== 'demo') rerender(); }
Object.assign(ACT, {
  scanEntry() {
    if (S.expired) { scanResult(false, 'Entry denied', `Membership expired on ${fmtLong(EXPIRED_ON)}. Renew it in the app or at the club office.`); return; }
    if (S.visit !== 'outside') { scanResult(false, 'Entry denied: already inside', 'Scan out at the club exit first.'); return; }
    S.visit = 'inside'; S.since = CLOCK;
    S.notes.unshift({ t: 'Entry recorded', b: `You entered the club at ${CLOCK}. You can book amenities now.`, d: 'Today, ' + CLOCK, ic: 'door', unread: true });
    scanResult(true, 'Welcome, Rahul', `Entry recorded at ${CLOCK}. You can book amenities now.`);
    afterScan();
  },
  scanAmenity() {
    if (S.visit === 'admitted') { ACT.scanOut(); return; }
    if (S.visit === 'outside') { scanResult(false, 'Denied: not inside', 'Scan in at the club entry first.'); return; }
    const today = upcoming().filter(b => b.date === TODAY && b.st === 'confirmed');
    const open = today.find(b => NOW >= b.h - .25 && NOW < b.end);
    if (!open) {
      const used = S.bookings.find(b => b.date === TODAY && b.st === 'used' && NOW < b.end), next = today[0];
      if (used) scanResult(false, 'Denied: already used', `This ${amOf(used.am).name.toLowerCase()} QR was used today. Book again in the app or at reception.`);
      else if (next) scanResult(false, 'Denied: too early', `Your ${amOf(next.am).name.toLowerCase()} slot starts at ${hm(next.h)}. The door opens 15 minutes before.`);
      else scanResult(false, 'Denied: no booking', 'There is no booking for this amenity now. Book in the app or at reception.');
      return;
    }
    const a = amOf(open.am);
    open.st = 'inuse'; S.visit = 'admitted'; S.admit = open.id;
    S.notes.unshift({ t: `Admitted at ${a.name.toLowerCase()}`, b: `Slot ends at ${hm(open.end)}. Scan the same QR to leave.`, d: 'Today, ' + CLOCK, ic: 'check', unread: true });
    scanResult(true, 'Admitted', `${a.name}, ${ppl(open.people.length)}. Slot ends at ${hm(open.end)}.`);
    afterScan();
  },
  scanOut() {
    if (S.visit !== 'admitted') { scanResult(false, 'Denied: not admitted', 'Scan your booking QR at the amenity door to enter first.'); return; }
    const b = bk(S.admit), a = amOf(b.am);
    b.st = 'used'; S.visit = 'inside'; S.admit = null;
    scanResult(true, 'Amenity exit recorded', `${a.name}, left at ${CLOCK}. No extra-time charge.`);
    afterScan();
  },
  leaveClub() {
    if (S.visit === 'outside') { scanResult(false, 'Denied: not inside', 'There is no open visit to close.'); return; }
    if (S.visit === 'admitted') { const b = bk(S.admit); if (b) b.st = 'used'; S.admit = null; }
    S.visit = 'outside';
    S.notes.unshift({ t: 'Visit closed', b: `You left the club at ${CLOCK}.`, d: 'Today, ' + CLOCK, ic: 'exit', unread: true });
    scanResult(true, 'Exit recorded', 'Your visit is closed. Have a good evening.');
    afterScan();
  },
  toggle(k) {
    S[k] = !S[k];
    afterScan();
    toast(`${TOGGLES.find(t => t[0] === k)[1]}: ${S[k] ? 'on' : 'off'}`);
  },
  resetDemo() {
    S = fresh(); S.signed = true;
    closeSheet(true); $('#overlay').innerHTML = '';
    renderDemo(); go('home'); toast('Demo reset');
  },
});

/* ---------- Routes and start ---------- */
R = [
  ['splash', scrSplash], ['signin', scrSignin], ['otp', scrOtp], ['lock', scrLock],
  ['home', scrHome], ['qr', scrQr], ['amenities', scrAmenities], ['amenity/:id', scrAmenity], ['slots/:id', scrSlots],
  ['people', scrPeople], ['review', scrReview], ['paying', scrPaying], ['confirmed/:id', scrConfirmed],
  ['bookings', scrBookings], ['booking/:id', scrBooking], ['wallet', scrWallet], ['addmoney', scrAddMoney],
  ['notifications', scrNotes], ['notification/:id', scrNote], ['more', scrMore], ['profile', scrProfile], ['guests', scrGuests], ['help', scrHelp], ['demo', scrDemo],
];
function fit() {
  SCALE = innerWidth >= 600 ? Math.min(1, (innerHeight - 40) / 868) : 1;
  document.documentElement.style.setProperty('--s', SCALE.toFixed(4));
}
tabbar.innerHTML = '<i class="tab-pill" aria-hidden="true"></i>' + [['home', 'home', 'Home'], ['amenities', 'cal', 'Book'], ['bookings', 'ticket', 'Bookings'], ['wallet', 'wallet', 'Wallet'], ['more', 'more', 'More']].map(([r, i, l]) => `<a class="tab" href="#/${r}" data-tab="${r}">${ic(i)}<span>${l}</span></a>`).join('');
$('#sbicons').innerHTML = SB;
fit();
addEventListener('resize', fit);
renderDemo();
addEventListener('hashchange', route);
route();
</script>
</body>
